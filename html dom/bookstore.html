<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOOKSTORE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #bookstore {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .book {
            width: 220px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
             
        }
        .book img {
            width: 150px;
            height: 200px;
            border-radius: 5px;
        }
        .book h2 {
            font-size: 18px;
            color: #333;
        }
      .book button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;        
        }
    </style>

</head>

<body>
    <h1>Book Store</h1>

    <div id="bookstore"></div>

    <script src="bookstore.js"></script>

</body>

</html>
